apply plugin: 'com.android.application'

android {
    compileSdkVersion 33

    defaultConfig {
        // FYTの「スリープで止めないアプリの一覧」(com.syu.ms の protected_app.txt)にある名前そのもの(要件O2)。
        // 本機の一覧に入っていることは 2026-10-01 に確認。完全一致・前方一致のどちらでも該当する。
        // コード上の名前(namespace = manifest の package)は com.livraison.wifiwatchdog のまま。
        // 変えると別のアプリ扱いになり、入れ直しと設定のやり直しが要る。
        applicationId "com.tiantian.ttclock"
        minSdkVersion 24
        // ★重要: targetSdkVersionを28以下にすることで
        // Android 10(Q)以降で強化されたWi-Fi API制限
        // (setWifiEnabled / enableNetwork 等が事実上無効化される問題)
        // を回避し、旧来どおりアプリからWi-Fiを直接制御できるようにする。
        targetSdkVersion 28
        versionCode 2
        versionName "1.1"
    }

    signingConfigs {
        // CIでは固定の鍵(GitHub Secrets の DEBUG_KEYSTORE_BASE64 から復元)で署名する。
        // 既定のままだとビルドのたびに新しい鍵が作られ、実機で上書きインストールできない。
        // 環境変数が無いとき(手元のビルド)は、Android標準のデバッグ鍵を使う。
        debug {
            def fixedKeystore = System.getenv("NAVI_DEBUG_KEYSTORE")
            if (fixedKeystore) {
                storeFile file(fixedKeystore)
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

configurations.all {
    // androidx.core 1.10+ が引くkotlin-stdlib(1.8+)は旧jdk7/jdk8拡張を統合済みのため、
    // 別経路で入る分割版(kotlin-stdlib-jdk7/jdk8)を除外してクラス重複を防ぐ。
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.10.1'
    // OpenStreetMap の地図(要件U13)。Apache License 2.0
    implementation 'org.osmdroid:osmdroid-android:6.1.18'
}
